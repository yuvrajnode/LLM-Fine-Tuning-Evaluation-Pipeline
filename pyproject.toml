[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmft"
version = "0.4.1"
description = "LoRA/RLHF fine-tuning and multi-checkpoint evaluation pipeline for open-source LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Singh" }]
keywords = ["llm", "lora", "peft", "rlhf", "dpo", "evaluation"]

dependencies = [
    "torch>=2.6.0,<3",
    "transformers>=4.49.0,<4.50",
    "peft>=0.14.0,<0.15",
    "trl>=0.15.2,<0.16",
    "accelerate>=1.2.0,<2",
    "datasets>=3.3.0,<4",
    "evaluate>=0.4.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.43.0; platform_system == 'Linux'"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "black>=24.3.0"]

[project.scripts]
llmft = "llmft.cli:app"

[tool.setuptools.packages.find]
include = ["llmft*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is "call Option() in the default"; B008 is a false positive here.
"llmft/cli.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
